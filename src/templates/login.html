<!DOCTYPE html>
<html>
<head>
    <title>Sanlam Login</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(120deg, #e0f7fa 0%, #b2ebf2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffffcc;
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            padding: 40px 32px 32px 32px;
            width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-container img {
            width: 120px;
            height: auto;
            margin-bottom: 24px;
            filter: drop-shadow(0 2px 8px rgba(0,119,200,0.10));
        }
        h2 {
            color: #0077c8;
            margin-bottom: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px 0;
            border: 1px solid #b2ebf2;
            border-radius: 6px;
            font-size: 1em;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #0077c8 60%, #00bfae 100%);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: linear-gradient(90deg, #00bfae 60%, #0077c8 100%);
        }
        .error {
            color: #d32f2f;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <form class="login-card" method="post">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='sanlam-logo.png') }}" alt="Sanlam Logo">
        </div>
        <h2>Login</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <input type="text" name="username" placeholder="Username" required autofocus>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
    </form>
</body>
</html>
